<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Terminal - Épico Expandido</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="game-container">
  <div class="hud">
    <div class="stat-box">
      <span>❤️ HP: <strong id="hpText">100/100</strong></span>
      <div class="bar-bg"><div id="hpBar" class="bar-fill hp-fill" style="width: 100%"></div></div>
    </div>
    <div class="stat-box">
      <span>💧 Mana: <strong id="mpText">50/50</strong></span>
      <div class="bar-bg"><div id="mpBar" class="bar-fill mp-fill" style="width: 100%"></div></div>
    </div>
    <div class="stat-box">
      <span>⭐ Nível: <strong id="lvlText">1</strong> (XP: <span id="xpText">0/30</span>)</span>
      <span>🪙 Ouro: <strong id="goldText" class="gold-text">10</strong></span>
    </div>
    <div class="stat-box">
      <span>📍 Local: <strong id="locText" class="loc-text">vila</strong></span>
      <span>🗡️ ATQ: <strong id="atkText">2-4</strong></span>
    </div>
  </div>

  <div id="output"></div>

  <div class="quick-actions">
    <button class="quick-btn" data-cmd="olhar">👁️ Olhar</button>
    <button class="quick-btn" data-cmd="atacar">⚔️ Atacar</button>
    <button class="quick-btn" data-cmd="defender">🛡️ Defender</button>
    <button class="quick-btn" data-cmd="inventario">📦 Inventário</button>
    <button class="quick-btn" data-cmd="missoes">📜 Missões</button>
    <button class="quick-btn" data-cmd="ajuda">❓ Ajuda</button>
  </div>

  <div class="input-area">
    <span class="prompt-symbol">&gt;</span>
    <input type="text" id="commandInput" placeholder="Escolha sua classe ou digite um comando..." autofocus autocomplete="off">
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
